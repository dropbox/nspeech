[package]
name = "speech"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]                 # !Dash
name = "main"           # !Dash
path = "src/main.rs"    # !Dash

[features]
#default = ["qwen"]  # Quantized inference is default (faster)
quantized = []            # Use quantized inference (QMatMul with Q8_0/Q4K weights)
embed-assets = []         # Embed model assets in binary
qwen = []                 # Enable Qwen3 text correction model (adds ~400MB to assets)
auto-transcribe-on-pause = []  # Automatically transcribe segments after detecting pause (non-default)
use-moonshine = []        # NAPI binding uses Moonshine V2 instead of Parakeet TDT
fast-cpu = ["dep:rayon"]  # CPU-optimized matmul: pre-dequantize to F32 + BLAS, with rayon-parallel Q8_0 fallback
fbgemm = ["fast-cpu", "dep:fbgemm-rs"]  # Additionally use fbgemm-rs AVX2/Neon packed GEMM (f32 weights)
fbgemm-bf16 = ["fbgemm"]               # Use bf16-packed weights with fbgemm-rs (half memory, ~0.4% accuracy loss)

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

candle-core = { git = "https://github.com/huggingface/candle", branch = "main" }
candle-nn = { git = "https://github.com/huggingface/candle", branch = "main" }
candle-transformers = { git = "https://github.com/huggingface/candle", branch = "main" }

# Tokenizer to decode Parakeet's SentencePiece/BPE tokens
tokenizers = "0.20"
hound = "3.5"
rustfft = "6.2"
num-complex = "0.4"

# For silero
safetensors = "0.4"

# For GGUF quantization and asset compression
tempfile = "3.8"
zstd = "0.13.3"
memmap2 = "0.9"

# NAPI bindings for Node.js
napi = "3.2.2"
napi-derive = "3.2.2"
log = "0.4"
once_cell = "1.21.3"

# CPU-optimized matmul (optional)
rayon = { version = "1", optional = true }
fbgemm-rs = { path = "../fbgemm-rs", optional = true, features = ["rayon"] }

[build-dependencies]
napi-build = "2.2.3"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { git = "https://github.com/huggingface/candle", branch = "main", features = ["metal", "accelerate"] }
candle-nn = { git = "https://github.com/huggingface/candle", branch = "main", features = ["metal", "accelerate"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
candle-core = { git = "https://github.com/huggingface/candle", branch = "main" }
candle-nn = { git = "https://github.com/huggingface/candle", branch = "main" }


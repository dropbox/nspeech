[package]
name = "speech"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]                 # !Dash
name = "main"           # !Dash
path = "src/main.rs"    # !Dash

[features]
default = []
quantized = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

candle-core = { version = "0.9", package = "candle-core", features = ["metal", "accelerate"] }
candle-nn   = { version = "0.9", package = "candle-nn", features = ["metal", "accelerate"] }

# Hugging Face Hub client (sync API is fine)
hf-hub = "0.4"

# Tokenizer to decode Parakeet's SentencePiece/BPE tokens
tokenizers = { version = "0.20", features = ["http"] }
hound = "3.5"
rustfft = "6.2"
num-complex = "0.4"

# For silero
safetensors = "0.4"

half = "2.4"

# For GGUF quantization
tempfile = "3.8"
zstd = "0.13"

# NAPI bindings for Node.js
napi = "=3.2.2"
napi-derive = "=3.2.2"
log = "0.4"
#env_logger = "0.11"
once_cell = "=1.21.3"

[build-dependencies]
napi-build = "=2.2.3"

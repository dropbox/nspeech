[package]
name = "parakeet"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "main"
path = "src/main.rs"

[features]
default = []
quantized = []
napi = ["dep:napi", "dep:napi-derive", "dep:log", "dep:env_logger"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

candle-core = { version = "0.9", package = "candle-core", features = ["metal", "accelerate"] }
candle-nn   = { version = "0.9", package = "candle-nn", features = ["metal", "accelerate"] }

# Hugging Face Hub client (sync API is fine)
hf-hub = "0.4"

# Tokenizer to decode Parakeet's SentencePiece/BPE tokens
tokenizers = { version = "0.20", features = ["http"] }
hound = "3.5"
rustfft = "6.2"
num-complex = "0.4"

# For silero
safetensors = "0.4"

# For loading quantized weights (NPZ format)
npyz = { version = "0.8", features = ["npz", "half"] }
half = "2.4"

# For GGUF quantization
tempfile = "3.8"
zstd = "0.13"

# Optional NAPI bindings for Node.js
napi = { version = "2", optional = true }
napi-derive = { version = "2", optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }

[build-dependencies]
napi-build = "2"

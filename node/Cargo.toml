[package]
name = "parakeet-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
parakeet = { path = ".." }

# NAPI bindings
napi = "2"
napi-derive = "2"

# Logging
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"

# Assets
zstd = "0.13"

# Core dependencies (from parent)
anyhow = "1"
candle-core = { version = "0.9", package = "candle-core", features = ["metal", "accelerate"] }
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"

[build-dependencies]
napi-build = "2"
